# System 1 — Security Scan (reusable workflow)
#
# Runs: Gitleaks (secrets) + Semgrep (SAST) + Trivy fs (SCA) + Trivy config (IaC)
# Three-job pattern: scan (credential-less) → notify (SES + OIDC) + gate.
#
# Gitleaks and Semgrep are health-checked (scripts/secinfra/scan_guard.py): a
# scanner that fails to load its config/rules turns the Scan job red and is
# called out in the email and the gate, instead of reporting a false "clean".
#
# Adopt in your repo:
#   jobs:
#     security:
#       uses: ignitesol/ignitesol.security-infra/.github/workflows/security-scan.yml@v1
#       secrets: inherit
#
# Optional inputs:
#   scan_root    — directory to scan (default: .)
#   semgrep_rules — override the central Semgrep ruleset ref
#   secinfra_ref  — pin the internal checkout of this repo's scripts/config
#                   to match your `uses:` ref exactly (default: this
#                   release's own tag — see below)

name: Security Scan

on:
  workflow_call:
    inputs:
      scan_root:
        description: Root directory to scan
        type: string
        default: "."
      semgrep_rules:
        description: Override Semgrep rules (leave blank to use org default)
        type: string
        default: ""
      secinfra_ref:
        description: >-
          Ref to check out for this repo's own scripts/config (scripts/,
          config/). Defaults to the tag this workflow file ships in;
          override if you pin `uses:` to something else and want scripts to
          match exactly.
        type: string
        default: "v1.1.1"
    secrets:
      SECINFRA_SES_ROLE_ARN:
        required: false
      SECINFRA_SES_FROM:
        required: false
      SECINFRA_SES_REGION:
        required: false
      SECINFRA_SECURITY_CC:
        required: false

jobs:
  # ── Job 1: run all scanners, emit results artifact ──────────────────────────
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout only
      security-events: write  # upload SARIF to GitHub Code Scanning
    outputs:
      results_artifact: security-results-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0

      - name: Checkout security-infra config
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: ignitesol/ignitesol.security-infra
          path: .secinfra
          ref: ${{ inputs.secinfra_ref }}
          sparse-checkout: |
            config
            scripts/secinfra

      - name: Install tools
        run: |
          set -euo pipefail
          # Gitleaks
          GITLEAKS_VERSION="8.30.1"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          # Semgrep
          pip install --quiet semgrep
          # Trivy
          TRIVY_VERSION="0.70.0"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy

      - name: Create results directory
        run: mkdir -p results

      # The scanner's exit status is captured (not swallowed) and handed to
      # scan_guard.py, which validates it and the output file. continue-on-error
      # lets the remaining scanners and the artifact upload still run; the
      # "Enforce scanner health" step below turns the job red at the end.
      - name: Gitleaks — secrets scan
        env:
          SCAN_ROOT: ${{ inputs.scan_root }}
        run: |
          rc=0
          # --exit-code 0: leaks never change the exit status, so any non-zero
          # exit is a real error (e.g. the config failed to load).
          # --redact: keep the leaked value out of the report, logs and email.
          gitleaks detect \
            --source "$SCAN_ROOT" \
            --config .secinfra/config/defaults/gitleaks.toml \
            --report-format json \
            --report-path results/gitleaks.json \
            --redact \
            --exit-code 0 \
            --log-level warn || rc=$?
          python3 .secinfra/scripts/secinfra/scan_guard.py record gitleaks \
            --exit-code "$rc" --results-dir results
        continue-on-error: true

      - name: Semgrep — SAST scan
        env:
          SCAN_ROOT: ${{ inputs.scan_root }}
          SEMGREP_RULES: ${{ inputs.semgrep_rules || 'p/default p/owasp-top-ten p/secrets' }}
        run: |
          # One --config flag per ruleset: a single space-joined argument is
          # read as ONE config name, loads zero rules and exits quietly.
          config_args=()
          while IFS= read -r arg; do
            config_args+=("$arg")
          done < <(
            python3 .secinfra/scripts/secinfra/scan_guard.py semgrep-args "$SEMGREP_RULES"
          )
          rc=0
          semgrep \
            "${config_args[@]}" \
            --sarif \
            --output results/semgrep.sarif \
            --no-autofix \
            "$SCAN_ROOT" || rc=$?
          python3 .secinfra/scripts/secinfra/scan_guard.py record semgrep \
            --exit-code "$rc" --results-dir results
        continue-on-error: true

      - name: Trivy — SCA (dependency CVEs)
        run: |
          trivy fs \
            --config .secinfra/config/defaults/trivy.yaml \
            --scanners vuln \
            --format json \
            --output results/trivy-sca.json \
            "${{ inputs.scan_root }}"
        continue-on-error: true

      - name: Trivy — IaC / container misconfig
        run: |
          trivy fs \
            --config .secinfra/config/defaults/trivy.yaml \
            --scanners misconfig \
            --format json \
            --output results/trivy-iac.json \
            "${{ inputs.scan_root }}"
        continue-on-error: true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@f52b05f4acaaa234e44466e66d29050e135ea9ef  # v4.36.0
        with:
          sarif_file: results/semgrep.sarif
        continue-on-error: true

      - name: Upload results artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: security-results-${{ github.run_id }}
          path: results/
          retention-days: 7

      # Runs last so a broken scanner never costs us the artifact. Fails the
      # job if gitleaks/semgrep did not run correctly or never reported.
      - name: Enforce scanner health
        run: |
          python3 .secinfra/scripts/secinfra/scan_guard.py enforce \
            --results-dir results

  # ── Job 2: notify — download artifact, render + send email ─────────────────
  notify:
    name: Notify
    needs: scan
    # Still report (and say the scan was incomplete) when a scanner broke.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC → SES role
      contents: read
    env:
      # Promoted to job level so the if: condition on the OIDC step can read it
      SECINFRA_SES_ROLE_ARN: ${{ secrets.SECINFRA_SES_ROLE_ARN }}
    steps:
      - name: Checkout security-infra (scripts + templates)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: ignitesol/ignitesol.security-infra
          path: .secinfra
          ref: ${{ inputs.secinfra_ref }}

      - name: Checkout caller repo (for .security/config.yml)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          path: .caller-repo

      - name: Download results artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: security-results-${{ github.run_id }}
          path: results

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install secinfra
        run: pip install --quiet .secinfra/

      - name: Configure AWS credentials (OIDC → SES role)
        if: ${{ env.SECINFRA_SES_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708  # v5.1.1
        with:
          role-to-assume: ${{ secrets.SECINFRA_SES_ROLE_ARN }}
          aws-region: ${{ secrets.SECINFRA_SES_REGION || 'us-east-1' }}

      - name: Send email report
        env:
          GITHUB_WORKSPACE: .caller-repo
          SECINFRA_SES_FROM: ${{ secrets.SECINFRA_SES_FROM }}
          SECINFRA_SES_REGION: ${{ secrets.SECINFRA_SES_REGION || 'us-east-1' }}
          SECINFRA_SECURITY_CC: ${{ secrets.SECINFRA_SECURITY_CC }}
          # Dry-run until prerequisites land; remove once SES is configured
          SECINFRA_DRY_RUN: ${{ secrets.SECINFRA_SES_ROLE_ARN == '' && '1' || '0' }}
        run: |
          python -m secinfra.security_report \
            --results-dir results \
            --workspace .caller-repo

  # ── Job 3: gate — evaluate severity threshold, fail the build if opted in ──
  #
  # Runs independently of `notify` (both depend only on `scan`) so email
  # delivery and merge-gating never block each other. Gating is opt-in via
  # systems.security.fail_on in the caller repo's .security/config.yml — see
  # docs/ADOPTION.md. To actually block merges, add this job's check as a
  # required status check in the caller repo's branch protection / ruleset —
  # GitHub names it "<caller job id> / Gate" (e.g. "security / Gate" for the
  # job id used in examples/caller-compliance.yml).
  gate:
    name: Gate
    needs: scan
    # Run even when Scan is red so the gate can fail closed on a broken
    # scanner; a skipped required check would otherwise count as passing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout security-infra (scripts)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          repository: ignitesol/ignitesol.security-infra
          path: .secinfra
          ref: ${{ inputs.secinfra_ref }}

      - name: Checkout caller repo (for .security/config.yml)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          path: .caller-repo

      - name: Download results artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          name: security-results-${{ github.run_id }}
          path: results

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install secinfra
        run: pip install --quiet .secinfra/

      - name: Evaluate merge gate
        run: |
          python -m secinfra.security_gate \
            --results-dir results \
            --workspace .caller-repo
