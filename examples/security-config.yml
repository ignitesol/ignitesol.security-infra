# Place this file in your repo at .security/config.yml
# The security@ inbox is always CC'd by the workflows; you only need to set 'to'.

email:
  to:
    - team-your-name@ignitesol.com   # replace with your team's address

systems:
  security: true
  bumblebee: true
  license: true

  # Each system above also accepts a dict form to opt into merge-gating
  # (report-only until you set fail_on — see docs/ADOPTION.md):
  # security:
  #   enabled: true
  #   fail_on: high    # none (default) | critical | high | medium | low
  #                    # Gitleaks (secret) findings always fail once any tier
  #                    # is set, regardless of how lenient the tier is.
  # bumblebee:
  #   enabled: true
  #   fail_on: any     # none (default) | any — no severity tiers upstream

license:
  # Subset of ecosystems present in your repo
  ecosystems:
    - npm
    - python
    # - java

  # Optional: override the install command per ecosystem
  # install:
  #   npm: "npm ci --ignore-scripts"
  #   python: "pip install -r requirements.txt"
  #   java: "mvn -q dependency:resolve"

  # Optional: merge-gate on license policy (empty/off by default). Checks
  # every dependency currently present, not just newly-added ones.
  # policy:
  #   deny: [GPL-3.0, AGPL-3.0, SSPL-1.0]   # SPDX ids/prefixes
  #   deny_unknown: true                     # fail on missing/"Unknown" license

paths:
  scan_root: "."
